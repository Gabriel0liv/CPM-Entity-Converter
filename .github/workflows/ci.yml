name: build
permissions:
  contents: read
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4 # major tag policy: Dependabot-reviewed official action
      - uses: actions/setup-java@v4 # major tag policy: Dependabot-reviewed official action
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle spotlessCheck
        shell: pwsh
        run: .\gradlew.bat spotlessCheck --no-daemon --stacktrace --info
      - name: Gradle clean check
        shell: pwsh
        run: .\gradlew.bat clean check --no-daemon --stacktrace --info
      - name: Reproducible build
        run: python scripts/verify-reproducible-build.py
      - name: Fixture manifest
        run: python test-fixtures/scripts/manifest.py --check
      - name: S004 fixture audit
        shell: pwsh
        run: python spikes/geckolib-animation-semantics/scripts/audit_fixtures.py
      - name: Frozen Gecko oracle
        shell: pwsh
        run: python spikes/geckolib-animation-semantics/scripts/verify_frozen_oracle.py
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/spotless/**
            build/reports/**
      - name: Verify worktree clean
        if: always()
        shell: pwsh
        run: |
          git status --short
          $tracked = @(git diff --name-only)
          $cached = @(git diff --cached --name-only)
          if ($tracked.Count -gt 0 -or $cached.Count -gt 0) {
            Write-Error "Tracked files were modified by the build."
            exit 1
          }

  t304-projectio:
    name: T304 ProjectIO (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout pinned CPM reference
        shell: bash
        run: |
          git clone --no-checkout https://github.com/tom5454/CustomPlayerModels.git cpm-reference
          git -C cpm-reference checkout 9272f4f9c36a2bbd6986e6da65bf7091369cb12b
          test "$(git -C cpm-reference rev-parse HEAD)" = "9272f4f9c36a2bbd6986e6da65bf7091369cb12b"
      - name: Generate and load ProjectIO artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat t304GenerateArtifacts t304ProjectIoConformance ":verification:projectio-conformance:test" "-PcpmReferenceDir=${{ github.workspace }}/cpm-reference" --no-daemon --stacktrace
      - name: Generate and load ProjectIO artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew t304GenerateArtifacts t304ProjectIoConformance :verification:projectio-conformance:test "-PcpmReferenceDir=${{ github.workspace }}/cpm-reference" --no-daemon --stacktrace
      - name: Verify T304 report and worktree
        shell: bash
        run: |
          test -f build/t304/artifacts/manifest.json
          test -f build/t304/projectio/projectio-report.json
          test -z "$(git status --short)"
