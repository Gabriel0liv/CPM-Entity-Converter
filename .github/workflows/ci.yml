name: build
permissions:
  contents: read
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix: {os: [windows-latest, ubuntu-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # major tag policy: Dependabot-reviewed official action
      - uses: actions/setup-java@v4 # major tag policy: Dependabot-reviewed official action
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os == 'Linux'
        run: bash ./gradlew spotlessCheck clean check
      - if: runner.os == 'Windows'
        run: .\gradlew.bat spotlessCheck clean check
      - run: python scripts/verify-reproducible-build.py
      - run: python test-fixtures/scripts/manifest.py --check
      - if: runner.os == 'Linux'
        run: python spikes/geckolib-animation-semantics/scripts/audit_fixtures.py

  projectio-conformance:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: {os: [windows-latest, ubuntu-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # major tag policy: Dependabot-reviewed official action
      - uses: actions/checkout@v4 # pinned CPM source checkout for verification-only compilation
        with:
          repository: tom5454/CustomPlayerModels
          ref: 9272f4f9c36a2bbd6986e6da65bf7091369cb12b
          path: cpm-reference
      - uses: actions/setup-java@v4 # major tag policy: Dependabot-reviewed official action
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os == 'Linux'
        run: bash ./gradlew :verification-projectio:dependencies --write-locks --write-verification-metadata sha256 -PcpmReferenceDir="$GITHUB_WORKSPACE/cpm-reference"
      - if: runner.os == 'Linux'
        run: bash ./gradlew :verification-projectio:spotlessCheck :verification-projectio:test -PcpmReferenceDir="$GITHUB_WORKSPACE/cpm-reference"
      - if: runner.os == 'Windows'
        run: .\gradlew.bat :verification-projectio:spotlessCheck :verification-projectio:test --write-locks --write-verification-metadata sha256 "-PcpmReferenceDir=$env:GITHUB_WORKSPACE\cpm-reference"
      - if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml verification-projectio/gradle.lockfile
          if ! git diff --cached --quiet; then
            git commit -m "build: lock T304 verification dependencies"
            git push origin HEAD:agent/correct-look-retargeting-phase1
          fi
