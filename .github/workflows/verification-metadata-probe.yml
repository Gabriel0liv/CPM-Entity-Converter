name: verification-metadata-probe

on:
  push:
    branches:
      - agent/correct-look-retargeting-phase1

permissions:
  contents: write

jobs:
  update-verification-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-look-retargeting-phase1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate missing SHA-256 verification metadata
        run: bash ./gradlew --write-verification-metadata sha256 :converter-config:compileJava
      - name: Show generated verification diff
        run: git diff -- gradle/verification-metadata.xml
      - name: Commit generated metadata when changed
        shell: bash
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "No verification metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "build: record missing Jackson verification metadata"
          git push origin HEAD:agent/correct-look-retargeting-phase1
