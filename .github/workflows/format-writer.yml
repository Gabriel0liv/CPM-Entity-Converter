name: format-writer-once

on:
  push:
    branches:
      - agent/correct-look-retargeting-phase1
    paths:
      - .github/workflows/format-writer.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-look-retargeting-phase1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply writer formatting
        run: bash ./gradlew :writer-cpm:spotlessApply
      - name: Commit formatted writer
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writer-cpm
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style: format T300 writer sources"
            git push origin HEAD:agent/correct-look-retargeting-phase1
          fi
