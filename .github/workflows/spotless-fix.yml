name: spotless-fix

on:
  push:
    branches:
      - agent/correct-look-retargeting-phase1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-look-retargeting-phase1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply repository formatter
        run: bash ./gradlew :converter-core:spotlessApply :converter-config:spotlessApply
      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add converter-core converter-config
          git commit -m "style: apply Spotless to phase one tests"
          git push origin HEAD:agent/correct-look-retargeting-phase1
